[package]
name = "cpp-example"
description = "Example bridge: safe Rust API over a small C++ shim that uses {fmt} from vcpkg."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Lets other bridge crates #include this crate's headers (cxx-build requires
# it) and orders build scripts. Must be unique, so use the crate name.
links = "cpp-example"

[dependencies]
cxx.workspace = true
thiserror.workspace = true
tracing.workspace = true

[build-dependencies]
build-support.workspace = true

[lints]
workspace = true
